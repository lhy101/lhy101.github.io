98089,"segments":[[0,4.61783439490445],[6.61783439490445,4.61783439490445]]},"K":{"version":1,"start":13.8,"done":15.5,"used":27.7,"start_step":31,"done_step":40,"train_step":57,"used_step":59,"duration":1.6999999999999993,"bar_width":21.222929936305725,"segments":[[0,5.740976645435242],[7.740976645435242,5.740976645435242],[15.481953290870484,5.740976645435242]]},"L":{"version":1,"start":13.8,"done":15.9,"used":27.7,"start_step":31,"done_step":48,"train_step":57,"used_step":59,"duration":2.0999999999999996,"bar_width":26.21656050955414,"segments":[[0,5.054140127388535],[7.054140127388535,5.054140127388535],[14.10828025477707,5.054140127388535],[21.162420382165603,5.054140127388535]]}},"max_concurrency":6,"text_duration":0.6,"text_regions":{"phase":[0,0,1600,64],"header":[0,64,1600,245],"footer":[0,920,1600,990]},"admission_fade_duration":2.2,"rollout_pixels_per_time":12.48407643312102,"layout":{"sx":796,"sy":450,"dx":179,"dy":135,"cw":160,"ch":80,"tray":[1333,285],"genX":195,"genY":330,"genDY":43,"tokenH":19,"trainLabelX":48,"trainBarX":620,"trainBarY":886,"trainBarW":930},"colors":{"teal":"#387F70","gold":"#A2662D","blue":"#436B9E","line":"#D1D8DD","muted":"#657079","paleGray":"#EFF1F3","paleGold":"#FFF1DA"},"source_commit":"c6c64a1fcf9105527f50531fdbfd6f626066797d","generation_note":"Rollout bar widths are proportional to completion time minus admission time in the replay, not token counts or measured GPU runtimes. All rows share one distance/time scale. During elapsed simulation both rollout and an active training update progress; instantaneous Reserve, Occupy and Consume actions advance neither.","revision":"1c2648d2dea2"};</script><script>/* Browser renderer for the same timeline exported by animate_psrl_staleness.py. */
(async function () {
  const scene=window.PSRL_SCENE, canvas=document.getElementById('full-animation');
  const ctx=canvas.getContext('2d'), L=scene.layout, C=scene.colors;
  const rasterScale=scene.pixel_scale||1;
  canvas.width=scene.width*rasterScale; canvas.height=scene.height*rasterScale;
  ctx.setTransform(rasterScale,0,0,rasterScale,0,0);
  ctx.imageSmoothingQuality='high';
  const base='../animation-layers/';
  const images=new Map();
  const loading=new Map();
  function loadImage(name){
    if(images.has(name))return Promise.resolve(images.get(name));
    if(loading.has(name))return loading.get(name);
    const promise=new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{images.set(name,im);loading.delete(name);resolve(im)};im.onerror=()=>{loading.delete(name);reject(Error('Cannot load '+name))};im.src=base+name+'?rev='+scene.revision;});
    loading.set(name,promise);return promise;
  }
  const backgroundName=(i,kind)=>`bg-${String(i+1).padStart(2,'0')}-${kind}.png`;
  const names=[];
  // Decode nearby full-resolution backgrounds on demand. Holding all 118
  // 3200px backgrounds would consume several gigabytes in the browser.
  for(let i=0;i<2;i++)for(const kind of ['motion','still'])names.push(backgroundName(i,kind));
  for(const s of scene.stages)for(const layers of Object.values(s.text_layers))names.push(...Object.values(layers));
  for(const n of Object.keys(scene.tracks))for(const state of ['RESERVED','OCCUPIED'])names.push(`${n}-${state}.png`);
  for(const label of ['待准入','生成中','已完成','已训练','训练中'])names.push(`label-${label}.png`);
  await Promise.all([...new Set(names)].map(loadImage));
  const clamp=x=>Math.max(0,Math.min(1,x)),ease=x=>x*x*(3-2*x);
  const admissionEase=x=>x*x*x*(x*(x*6-15)+10);
  let clock=0,playing=true,speed=1,last=performance.now(),drawCount=0;
  const scrub=document.getElementById('timeline');scrub.max=scene.duration;
  function stageIndex(t){let i=0;while(i<scene.stages.length-1&&t>=scene.stages[i].end)i++;return i;}
  function simulationTime(t){const s=scene.stages[stageIndex(t)],u=s.move?clamp((t-s.start)/s.move):1;return s.sim_start+(s.sim_end-s.sim_start)*u}
  function rowState(tr,t){
    const s=scene.stages[stageIndex(t)],done=t>=s.start+s.move-1e-7,sim=simulationTime(t);
    if(s.step<tr.start_step||(s.step===tr.start_step&&!done))return {p:0,label:'待准入'};
    if(s.step>tr.used_step||(s.step===tr.used_step&&done))return {p:1,label:'已训练'};
    if(s.step>tr.train_step||(s.step===tr.train_step&&done))return {p:1,label:'训练中'};
    if(sim>=tr.done-1e-7&&s.step>=tr.done_step)return {p:1,label:'已完成'};
    return {p:clamp((sim-tr.start)/(tr.done-tr.start)),label:'生成中'};
  }
  function trainingState(t){
    const i=stageIndex(t),s=scene.stages[i];
    const f=s.time_kind==='instant'&&t<s.start+s.move-1e-7?scene.stages[Math.max(0,i-1)].frame:s.frame;
    const job=f.training;
    return {job,p:job?clamp((simulationTime(t)-job.start)/(job.end-job.start)):0};
  }
  function drawText(t,i){
    const s=scene.stages[i],elapsed=t-s.start,moving=elapsed<s.move;
    for(const [region,box] of Object.entries(scene.text_regions)){
      const current=s.text_layers[moving?'motion':'still'][region];
      let before=current,u=1;
      const previous=scene.stages[Math.max(0,i-1)].text_layers.still[region];
      if(i>0&&elapsed<scene.text_duration&&previous!==current){before=previous;u=clamp(elapsed/scene.text_duration)}
      else if(!moving&&elapsed-s.move<scene.text_duration&&s.text_layers.motion[region]!==current){before=s.text_layers.motion[region];u=clamp((elapsed-s.move)/scene.text_duration)}
      let parts;
      if(before===current)parts=[[current,1,0]];
      else if(u<.45){const q=ease(u/.45);parts=[[before,1-q,-18*q]]}
      else {const q=ease((u-.45)/.55);parts=[[current,q,18*(1-q)]]}
      ctx.save();ctx.beginPath();ctx.rect(box[0],box[1],box[2]-box[0],box[3]-box[1]);
      if(region==='header')ctx.rect(1300,218,scene.width-1300,23);
      ctx.clip('evenodd');
      for(const [name,alpha,y] of parts){ctx.globalAlpha=alpha;ctx.drawImage(images.get(name),box[0],box[1]+y,box[2]-box[0],box[3]-box[1])}
      ctx.restore();
      if(region==='header')ctx.drawImage(images.get(current),1300*rasterScale,(218-box[1])*rasterScale,(scene.width-1300)*rasterScale,23*rasterScale,1300,218,scene.width-1300,23);
    }
  }
  function draw(t){
    const i=stageIndex(t),s=scene.stages[i],old=scene.stages[Math.max(0,i-1)].tokens,current=s.tokens;
    const moving=t<s.start+s.move,u=s.move?clamp((t-s.start)/s.move):1,q=ease(u);
    const background=backgroundName(i,moving?'motion':'still');
    if(!images.has(background)){loadImage(background).then(()=>draw(clock));return;}
    for(let next=i;next<=Math.min(i+1,scene.stages.length-1);next++)for(const kind of ['motion','still'])loadImage(backgroundName(next,kind));
    for(const [name,im] of images){const match=name.match(/^bg-(\d+)-/);if(match&&Math.abs(Number(match[1])-1-i)>1){images.delete(name);im.src='';}}
    ctx.drawImage(images.get(background),0,0,scene.width,scene.height);
    drawText(t,i);
    let row=0;
    for(const [n,tr] of Object.entries(scene.tracks)){
      const y=L.genY+row*L.genDY;row++;
      const {p,label}=rowState(tr,t);
      ctx.fillStyle=label==='已训练'?C.muted:label==='训练中'?C.blue:p>=1?C.teal:C.gold;
      for(const [x,width] of tr.segments){const w=Math.max(0,Math.min(width,p*tr.bar_width-x));if(w>.1){ctx.beginPath();ctx.roundRect(L.genX+x,y,w,L.tokenH,Math.min(2,w/2));ctx.fill()}}
      const labelImage=images.get(`label-${label}.png`);
      ctx.drawImage(labelImage,410,y-2,labelImage.width/rasterScale,labelImage.height/rasterScale);
    }
    for(const n of [...new Set([...Object.keys(old),...Object.keys(current)])].sort()){
      let a=old[n],b=current[n],alpha=1,scale=1;
      if(!a){a=b;alpha=admissionEase(u);scale=1}
      if(!b){b=a;alpha=1-q;scale=1-.15*q}
      let x=a.x+(b.x-a.x)*q,y=a.y+(b.y-a.y)*q;
      const moved=a.x!==b.x||a.y!==b.y;
      if(moved){y-=Math.sin(Math.PI*q)*Math.min(55,Math.abs(a.x-b.x)*.12+14);scale=1-.32*Math.sin(Math.PI*q)}
      const w=(L.cw+1)*scale,h=(L.ch+1)*scale;
      ctx.globalAlpha=alpha;
      ctx.drawImage(images.get(`${n}-${b.state}.png`),x+(L.cw-w)/2,y+(L.ch-h)/2,w,h);
      ctx.globalAlpha=1;
    }
    const training=trainingState(t);
    if(training.job&&training.p>0){ctx.fillStyle=C.teal;ctx.beginPath();ctx.roundRect(L.trainBarX,L.trainBarY,L.trainBarW*training.p,12,Math.min(6,L.trainBarW*training.p/2));ctx.fill()}
    scrub.value=t;
    const title=(s.frame.narration||s.frame).title.replace(/\bB(\d+)\b/g,'Buffer v$1').replace(/请求/g,' trajectory ').replace(/Consume/g,'取出 batch').replace(/Verify/g,'准入检查');
    document.getElementById('time-label').textContent=`${format(t)} / ${format(scene.duration)}`;
    canvas.setAttribute('aria-label',title);
    drawCount++;
  }
  function format(t){return `${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`}
  function setPlaying(value){playing=value;last=performance.now();document.getElementById('play').textContent=playing?'暂停':'播放'}
  function seek(t){clock=Math.max(0,Math.min(scene.duration-.001,t));last=performance.now();const i=stageIndex(clock),s=scene.stages[i];return loadImage(backgroundName(i,clock<s.start+s.move?'motion':'still')).then(()=>draw(clock))}
  function selectStep(n){const s=scene.stages[Math.max(0,Math.min(scene.stages.length-1,n-1))];setPlaying(false);return seek(Math.min(s.start+s.move+scene.text_duration,s.end-.001))}
  document.getElementById('play').onclick=()=>setPlaying(!playing);
  document.getElementById('restart').onclick=()=>{seek(0);setPlaying(true)};
  document.getElementById('speed').onchange=e=>{speed=Number(e.target.value);last=performance.now()};
  scrub.oninput=()=>{setPlaying(false);seek(Number(scrub.value))};
  window.psrlPlayer={seek,selectStep,setPlaying,simulationTime,rowState,trainingState,get time(){return clock},get drawCount(){return drawCount},get backgroundCount(){return [...images.keys()].filter(name=>name.startsWith('bg-')).length},scene};
  document.getElementById('loading').hidden=true;
