<div class="masthead">
  <div class="masthead__inner-wrap">
    <nav class="portfolio-nav" aria-label="Main navigation">
      <a class="site-brand" href="{{ site.baseurl }}/" aria-label="Haoyang Li — Home">
        <img class="site-brand__monogram" src="{{ '/images/li-monogram.svg?v=20261017' | relative_url }}" width="64" height="64" alt="" aria-hidden="true">
        <span class="site-brand__name">Haoyang Li<span>Homepage</span></span>
      </a>
      <div class="portfolio-nav__links">
        {% for link in site.data.navigation.main %}
        <a href="{% unless link.url contains 'http' %}{{ site.baseurl }}{% endunless %}{{ link.url }}"{% if page.permalink == link.url %} aria-current="page"{% endif %}>{{ link.title }} <span aria-hidden="true">↗</span></a>
        {% endfor %}
      </div>
    </nav>
  </div>
</div>
