{% assign share_image = page.cover | default: '/images/personal.png' %}
{% unless page.date %}<meta property="og:type" content="website">{% endunless %}
<meta property="og:image" content="{{ share_image | absolute_url }}">
<meta property="og:image:alt" content="{{ page.cover_alt | default: 'Haoyang Li, Peking University' | escape }}">
<meta name="twitter:card" content="{% if page.cover %}summary_large_image{% else %}summary{% endif %}">
<meta name="twitter:title" content="{{ seo_title | escape }}">
<meta name="twitter:description" content="{{ seo_description }}">
<meta name="twitter:image" content="{{ share_image | absolute_url }}">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Person",
      "@id": "{{ '/' | absolute_url }}#haoyang-li",
      "name": "Haoyang Li",
      "alternateName": ["Haoyang Li (Peking University)", "Haoyang Li (PKU)", "lhy101"],
      "givenName": "Haoyang",
      "familyName": "Li",
      "url": {{ '/' | absolute_url | jsonify }},
      "image": {{ '/images/personal.png' | absolute_url | jsonify }},
      "jobTitle": "Ph.D. student in Computer Science",
      "description": {{ site.description | jsonify }},
      "affiliation": { "@type": "CollegeOrUniversity", "name": "Peking University", "alternateName": "PKU", "url": "https://www.pku.edu.cn/" },
      "knowsAbout": ["Deep learning training systems", "Reinforcement learning post-training", "Distributed systems"],
      "sameAs": {{ site.social.links | jsonify }}
    },
    {
      "@type": "WebSite",
      "@id": "{{ '/' | absolute_url }}#website",
      "name": {{ site.title | jsonify }},
      "alternateName": "Haoyang Li",
      "url": {{ '/' | absolute_url | jsonify }},
      "inLanguage": "en",
      "author": { "@id": "{{ '/' | absolute_url }}#haoyang-li" }
    },
    {
      "@type": "{% if page.layout == 'blog-post' %}BlogPosting{% elsif page.permalink == '/' %}ProfilePage{% else %}CollectionPage{% endif %}",
      "@id": {{ page.url | absolute_url | jsonify }},
      "url": {{ page.url | absolute_url | jsonify }},
      "name": {{ page.title | jsonify }},
      {% if page.layout == 'blog-post' %}
      "headline": {{ page.title | jsonify }},
      "description": {{ page.description | jsonify }},
      "inLanguage": {{ page.lang | jsonify }},
      "datePublished": "{{ page.date | date: '%Y-%m-%d' }}",
      "image": {{ page.cover | absolute_url | jsonify }},
      "author": { "@id": "{{ '/' | absolute_url }}#haoyang-li" },
      {% endif %}
      "isPartOf": { "@id": "{{ '/' | absolute_url }}#website" },
      "{% if page.permalink == '/' %}mainEntity{% else %}about{% endif %}": { "@id": "{{ '/' | absolute_url }}#haoyang-li" }
    }
  ]
}
</script>
