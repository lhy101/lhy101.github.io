{% assign visitor_map_id = site.data.visitor_map.site_id | default: '' | strip %}
{% if visitor_map_id != '' %}
<section class="visitor-map" aria-labelledby="visitor-map-heading" data-visitor-map data-site-id="{{ visitor_map_id | escape }}" data-stats-url="{{ site.data.visitor_map.stats_url | escape }}" data-site-host="{{ site.url | remove: 'https://' | remove: 'http://' | split: '/' | first }}">
  <div class="visitor-map__intro"><h3 id="visitor-map-heading">Visitors</h3><p>Thank you for stopping by.</p></div>
  <div class="visitor-map__canvas" data-visitor-map-canvas hidden></div>
  <p class="visitor-map__status" data-visitor-map-status role="status" hidden></p>
  <div class="visitor-map__actions">
    <a class="visitor-map__fallback-link" href="{{ site.data.visitor_map.stats_url | escape }}">View visitor statistics <span aria-hidden="true">↗</span></a>
    <button class="visitor-map__retry" type="button" data-visitor-map-retry hidden>Retry</button>
  </div>
</section>
<script src="{{ '/assets/js/visitor-map.js' | relative_url }}?v=20261024" defer></script>
{% endif %}
